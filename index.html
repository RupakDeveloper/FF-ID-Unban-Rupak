<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101014;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      padding: 40px 25px;
      border: 1px solid #383842;
      border-radius: 20px;
      max-width: 420px;
      margin: 20px;
    }

    h1 {
      font-size: 38px;
      color: #a78bfa;
    }

    p {
      color: #c5c5d0;
      line-height: 1.7;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #8b5cf6;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p>This is my first website.</p>
    <button onclick="alert('My website is working!')">
      Click Me
    </button>
  </div>
</body>
</html>
